# Общие настройки сравнения цен.

# Наш каталог.
our:
  file: data/our/Шаблон_учета_запчастей.xlsx
  sheet: Запчасти
  header_row: 1
  currency: KZT
  price_note: розничная цена продажи (колонка «Цена продажи»)
  columns:
    id: ID
    article: Артикул
    name: Наименование
    price: Цена продажи
    brand: Производитель
    car: Подходит к авто
    category: Категория

# Валюта отчёта и курсы к ней (сколько тенге за 1 единицу валюты).
report_currency: KZT
rates:
  RUB: 5.35
rates_date: 2026-10-12
rates_source: официальный курс Национального банка РК

# Цены поставщиков — оптовые, берутся как ориентир; доставка и растаможка не добавляются.
supplier_price_note: оптовые, без доставки и растаможки, рубли — по курсу

# Аналоги — позиции с тем же артикулом, но другого производителя,
# чем ГАЗ/УАЗ (см. brands.yaml, original: true).
# false — показываются в «Деталях», в среднюю цену не идут.
count_analogs: false

# Цена дальше от медианы, чем в столько раз, — вероятная ошибка.
outlier_factor: 3

# Подсказки по названию для ненайденных товаров: сколько и с какого сходства (0…1).
name_hints: 3
name_hint_min_score: 0.5

output_dir: result

# Артикул короче этого (после нормализации) не сопоставляется:
# «3302» или «3207» совпадают с десятками чужих позиций.
min_article_length: 5
