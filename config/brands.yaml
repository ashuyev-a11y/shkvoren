# Единое написание производителей. Пополняется по мере появления новых прайсов.
#
# brands — канонический бренд и все варианты его написания в прайсах.
#   Регистр, кавычки и лишние пробелы при сравнении не важны.
#   original: true — заводской ГАЗ/УАЗ: такие предложения идут в расчёт.
#   Остальные бренды — аналоги (в расчёт только при count_analogs: true в settings.yaml).
#
# not_a_brand — значения колонки «Производитель», которые брендом не являются
#   (города, «прочие», пусто). Совпадение по артикулу с таким значением
#   идёт в «На проверку» и в расчёт не входит.
#   Строка, начинающаяся с ^, — регулярное выражение.

brands:
  УАЗ:
    original: true
    aliases: [УАЗ, ОАО УАЗ, ООО УАЗ, ПАО УАЗ, UAZ, ООО "УАЗ-Автокомпонент"]
  ГАЗ:
    original: true
    aliases: [ГАЗ, ГАЗ (Нижний Новгород), GAZ]

  # Моторные заводы ГАЗ/УАЗ — считаются оригиналом (решение владельца 12.10.2026).
  ЗМЗ:
    original: true
    aliases: [ЗМЗ, ОАО ЗМЗ]
  УМЗ:
    original: true
    aliases: [УМЗ, ОАО УМЗ]

  АДС:
    aliases: [АДС, ОАО Автодеталь Сервис]
  Балаково РТИ:
    aliases: [Балаково (Резинотехника), '"Балаковорезинотехника"-БРТ', ОАО БалаковоРезиноТехника]
  Дайдо:
    aliases: [ДАЙДО, Дайдо Металл Русь, Дайдо Металл Русь (Заволжье)]
  KENO:
    aliases: [KENO, KENO Group LLC]
  TANAKI:
    aliases: [TANAKI, TANAKI Co. Ltd]
  Красная Этна:
    aliases: [Красная Этна ОАО, КРАСНАЯ ЭТНА (Н.Новгород)]
  Апогей:
    aliases: [Апогей, АПОГЕЙ (Ульяновск)]
  ИжАвтоТорм:
    aliases: [ИжАвтоТорм, ИЖАВТОТОРМ (Ижевск)]
  MetalPart:
    aliases: [MetalPart (Санкт-Петербург), MetalPart (Санкт-Петербург) (производитель)]
  BOSCH:
    aliases: [BOSCH, 'BOSCH, Германия', Энгельс Бош]
  Андория:
    aliases: [Андория, ANDORIA]
  DYMOS:
    aliases: [DYMOS, DYMOS (Корея)]
  Газелист 52:
    aliases: [Газелист52, Газелист 52]
  СОАТЭ:
    aliases: [СОАТЭ, СОАТЭ (Ст.Оскол)]
  ВРТ:
    aliases: [Волжский (Газ), ВолжскРезинотехника ЗАО (ВРТ), Волжскрезинотехника-VRT]

not_a_brand:
  - '^ПРОЧИЕ'
  - ОБЩАЯ
  - Тест
  # Города и страны вместо производителя (Росзапчасть).
  - Санкт-Петербург
  - Н.Новгород
  - Ульяновск
  - Димитровград
  - Ярославль
  - Балаково
  - Волжский
  - Чайковский
  - Казань/Чайковский
  - Рязань
  - Москва
  - Казань
  - Кострома
  - Саранск
  - Калуга
  - Миасс
  - Дзержинск
  - Владимир
  - Конотоп
  - Пустынь
  - Тамбов
  - Воронеж
  - Липецк
  - Лихославль
  - Павлово
  - Киров
  - Мичуринск
  - Арзамас
