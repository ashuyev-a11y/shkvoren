# Прайсы поставщиков. Один блок = один поставщик.
# Новый поставщик добавляется только записью сюда — код не меняется.
#
# Поля:
#   name        — как поставщик называется в отчёте
#   file        — путь к файлу от корня репозитория; можно шаблон со *
#                 (берётся последний по имени файл — удобно, когда в имени дата)
#   currency    — валюта цен: KZT или код из settings.yaml → rates (RUB, …)
#   sheets      — список листов; all — все листы файла.
#                 Элемент списка — имя листа или {name: …, header_row: …}
#   header_row  — номер строки заголовков, как в Excel (с 1).
#                 auto — найти строку, где есть названия всех колонок из columns
#   columns     — названия колонок в строке заголовков. Обязательны article и price.
#                 Необязательные: brand, name, unit, stock, code, oem (кроссы через ; , /)
#   dedupe_by   — колонка (ключ из columns), по которой убрать повторы,
#                 если один товар есть на нескольких листах
#   pack_units  — единицы, при которых цена может быть не за штуку:
#                 такие строки идут в расчёт, но попадают в «На проверку»

suppliers:
  - name: УАЗ Автоград
    file: data/suppliers/Прайс УАЗ Автоград*.xls
    currency: RUB
    # «По группам» — те же позиции с заголовками групп, «Новинки» — их подмножество.
    sheets: [По алфавиту]
    header_row: 10
    columns:
      article: Артикул
      brand: Производитель
      name: Наименование
      price: Цена
      unit: Ед. изм
      stock: Ост.
      code: Код
    dedupe_by: code
    pack_units: [компл, упак, упак., кт, к-т]

  - name: Росзапчасть
    file: data/suppliers/Прайс Росзапчасть*.xlsx
    currency: KZT
    sheets: all
    header_row: auto
    columns:
      article: Артикул
      brand: Производитель
      name: Номенклатура
      price: Цена
      unit: Единица измерения
      stock: Кол-во
      code: Код
    pack_units: [компл, упак, кт, к-т]

  # Сервис-Штамп — раскомментировать, когда файл будет в data/suppliers/,
  # и поправить названия колонок по его шапке.
